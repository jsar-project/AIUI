<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" data-diagram-version="2">
  <title id="title">Page lifecycle flow</title>
  <desc id="desc">A Page loads once, shows, becomes ready after its first render, can cycle between shown and hidden, and ends with onUnload.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3c4043" flood-opacity=".14"/></filter>
    <style>text{font-family:Inter,"Noto Sans SC","PingFang SC",Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#202124}.label{font-size:19px;font-weight:700;fill:#202124}.state{font-size:14px;fill:#5f6368}.note{font-size:13px;font-weight:600;fill:#5f6368}.flow{fill:none;stroke:#5f6368;stroke-width:3}.head{fill:#5f6368}</style>
  </defs>
  <rect width="1200" height="520" fill="#fff"/><path d="M0 0h1200v8H0z" fill="#34a853"/>
  <text x="52" y="58" class="title">Page lifecycle</text>
  <g filter="url(#shadow)"><rect x="75" y="154" width="100" height="72" rx="36" fill="#f8f9fa" stroke="#dadce0"/><text x="125" y="196" text-anchor="middle" class="label">Create</text></g>
  <g filter="url(#shadow)"><rect x="235" y="130" width="170" height="120" rx="18" fill="#e6f4ea" stroke="#81c995"/><circle cx="271" cy="168" r="16" fill="#34a853"/><text x="299" y="175" class="label">onLoad</text><text x="260" y="218" class="state">Create once</text></g>
  <g filter="url(#shadow)"><rect x="475" y="130" width="170" height="120" rx="18" fill="#e6f4ea" stroke="#81c995"/><circle cx="511" cy="168" r="16" fill="#34a853"/><text x="539" y="175" class="label">onShow</text><text x="500" y="218" class="state">Become visible</text></g>
  <g filter="url(#shadow)"><rect x="715" y="130" width="170" height="120" rx="18" fill="#f1f8f3" stroke="#a8dab5"/><circle cx="751" cy="168" r="16" fill="#188038"/><text x="779" y="175" class="label">onReady</text><text x="740" y="218" class="state">First render once</text></g>
  <g filter="url(#shadow)"><rect x="955" y="130" width="170" height="120" rx="18" fill="#f8f9fa" stroke="#bdc1c6"/><text x="1040" y="179" text-anchor="middle" class="label">Visible</text><text x="1040" y="218" text-anchor="middle" class="state">Active page</text></g>
  <g filter="url(#shadow)"><rect x="715" y="350" width="170" height="110" rx="18" fill="#e6f4ea" stroke="#81c995"/><circle cx="751" cy="386" r="16" fill="#34a853"/><text x="779" y="393" class="label">onHide</text><text x="740" y="433" class="state">Keep page alive</text></g>
  <text x="560" y="442" text-anchor="middle" class="note">Visibility cycle</text>
  <g filter="url(#shadow)"><rect x="955" y="350" width="170" height="110" rx="18" fill="#fce8e6" stroke="#f28b82"/><text x="1040" y="399" text-anchor="middle" class="label">onUnload</text><text x="1040" y="433" text-anchor="middle" class="state">Release page</text></g>
  <path d="M175 190H223" class="flow"/><path d="M405 190H463" class="flow"/><path d="M645 190H703" class="flow"/><path d="M885 190H943" class="flow"/>
  <path d="M1040 250v35c0 11-9 20-20 20H820c-11 0-20 9-20 20v13" class="flow"/>
  <path d="M715 405H590c-17 0-30-13-30-30V262" class="flow"/>
  <path d="M885 405H943" class="flow"/>
  <path d="M223 190l-13-8v16zM463 190l-13-8v16zM703 190l-13-8v16zM943 190l-13-8v16zM800 338l-8-13h16zM560 262l-8 13h16zM943 405l-13-8v16z" class="head"/>
</svg>
